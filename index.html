<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: простой магазин — чёрная шапка и баннер, светлый каталог, жёлтый для действий, зелёный для доставки и WhatsApp.
   Светлая и тёмная темы; переключатели темы и языка (RU / AZ) в шапке. */
:root {
  --bg: #f5f6f3;
  --surface: #ffffff;
  --black: #121412;
  --ink: #121412;
  --ink-soft: #5d635d;
  --line: #e3e6e0;
  --yellow: #ffd60a;
  --green: #22a861;
  --tint-y: #fff6c4;
  --tint-g: #e1f4e8;
  --tint-n: #eeefeb;
  --grey-soft: #eeefeb;
  --chip-on-bg: #121412;
  --chip-on-fg: #ffd60a;
  --panel: #121412;
  --panel-line: #121412;
  --done-bg: #e1f4e8;
  --done-fg: #145c35;
  --err: #c0362c;
  --header-line: #121412;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f0d; --surface: #171a17; --ink: #eef1ec; --ink-soft: #a2a8a1; --line: #282c28;
    --tint-y: #36311a; --tint-g: #173322; --tint-n: #232623; --grey-soft: #262a26;
    --chip-on-bg: #ffd60a; --chip-on-fg: #121412; --panel: #171a17; --panel-line: #2e332e;
    --done-bg: #173322; --done-fg: #9fe3bb; --err: #ff7b70; --header-line: #232723; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f0d; --surface: #171a17; --ink: #eef1ec; --ink-soft: #a2a8a1; --line: #282c28;
  --tint-y: #36311a; --tint-g: #173322; --tint-n: #232623; --grey-soft: #262a26;
  --chip-on-bg: #ffd60a; --chip-on-fg: #121412; --panel: #171a17; --panel-line: #2e332e;
  --done-bg: #173322; --done-fg: #9fe3bb; --err: #ff7b70; --header-line: #232723; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { line-height: 1.12; margin: 0; text-wrap: balance; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: clamp(28px, 4vw, 40px); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 8px; }
section { scroll-margin-top: 80px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 12px 20px; text-decoration: none;
  background: var(--yellow); color: #121412; font-weight: 700;
  transition: background .15s ease, transform .1s ease;
}
.btn:hover { background: #ffe23d; }
.btn:active { transform: scale(.97); }
.btn.green { background: var(--green); color: #fff; }
.btn.green:hover { background: #1d9455; }
.btn.outline { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #3a3e3a; }
.btn.outline:hover { box-shadow: inset 0 0 0 2px var(--yellow); }
.btn svg { width: 18px; height: 18px; flex: none; }

/* Announcement bar */
.bar { background: var(--yellow); color: #121412; font-size: 14px; font-weight: 700; text-align: center; }
.bar .wrap { padding-block: 8px; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--black); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--black); color: #fff; border-bottom: 1px solid var(--header-line); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.logo { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #fff; text-decoration: none; }
.logo span { color: var(--yellow); }
.nav-links { display: flex; gap: 22px; font-weight: 600; font-size: 15px; }
.nav-links a { color: #b9beb8; text-decoration: none; }
.nav-links a:hover { color: #fff; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border-radius: 12px; box-shadow: inset 0 0 0 2px #3a3e3a; padding: 3px; }
.lang button { border: 0; background: transparent; color: #b9beb8; font-weight: 800; font-size: 13px; padding: 7px 9px; border-radius: 9px; }
.lang button[aria-pressed="true"] { background: var(--yellow); color: #121412; }
.theme-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; color: #fff;
  box-shadow: inset 0 0 0 2px #3a3e3a; display: grid; place-items: center;
}
.theme-btn:hover { box-shadow: inset 0 0 0 2px var(--yellow); color: var(--yellow); }
.theme-btn svg { width: 20px; height: 20px; }
.cart-count {
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #121412; color: var(--yellow);
  font-size: 12px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
@media (max-width: 900px) { .nav-links { display: none; } }
@media (max-width: 460px) { .cart-label { display: none; } #openCart { padding: 10px 12px; } .logo { font-size: 21px; } }

/* Hero */
.hero-band { background: var(--black); color: #fff; }
.hero { padding-block: 40px 56px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
.hero > * { min-width: 0; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #b9beb8; }
.kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.hero h1 { font-size: clamp(36px, 6vw, 62px); margin-block: 14px 16px; }
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero .lead { font-size: 18px; color: #c9cec8; max-width: 46ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.perks { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 30px; font-size: 14px; color: #b9beb8; }
.perks b { color: #fff; font-weight: 700; }
.showcase { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { border-radius: var(--r); aspect-ratio: 1; display: grid; place-items: center; position: relative; text-decoration: none; transition: transform .15s ease; }
.tile:hover { transform: translateY(-3px); }
.tile { overflow: hidden; background: #fff; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile span { position: absolute; left: 10px; bottom: 10px; font-size: 13px; font-weight: 700; color: #121412; background: var(--yellow); padding: 4px 10px; border-radius: 999px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .showcase { max-width: 440px; } }

/* Benefits */
.benefits { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: -28px; position: relative; }
.benefit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
.benefit .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--tint-y); color: var(--ink); }
.benefit:nth-child(even) .ic { background: var(--tint-g); }
.benefit .ic svg { width: 22px; height: 22px; }
.benefit b { display: block; font-size: 15px; }
.benefit p { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }

/* Sections */
section { padding-block: 48px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.section-head p { color: var(--ink-soft); max-width: 56ch; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; color: var(--ink-soft); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); box-shadow: none; }

/* Gift finder */
.gift { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 4vw, 36px); }
.gift-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-block: 20px 24px; }
.gift-controls .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; display: block; }
.gift-none { color: var(--ink-soft); padding: 20px; border: 1.5px dashed var(--line); border-radius: var(--r); text-align: center; }

/* Catalog */
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 22px; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px 11px 40px; }
.search input:focus { border-color: var(--green); outline: none; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s ease, transform .2s ease; }
.card:hover { box-shadow: 0 10px 30px rgba(18,20,18,.08); transform: translateY(-2px); }
.card .art { aspect-ratio: 1; position: relative; background: #fff; overflow: hidden; }
.card .art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
.card:hover .art img { transform: scale(1.04); }
.badge { position: absolute; top: 12px; left: 12px; background: #121412; color: var(--yellow); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.age { position: absolute; top: 12px; right: 12px; background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cat-label { font-size: 12px; font-weight: 600; color: var(--green); }
.card h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.card .note { font-size: 14px; color: var(--ink-soft); }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 14px; }
.price { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.buy .btn { padding: 9px 16px; font-size: 15px; }
.variant { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.vbtn { border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.vbtn:hover { color: var(--ink); }
.vbtn[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); box-shadow: none; }
.vtag { background: var(--grey-soft); color: var(--ink); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.stock { font-size: 13px; font-weight: 700; color: var(--green); margin-top: 6px; }
.stock.out { color: var(--ink-soft); }
.btn:disabled, .qty button:disabled { background: var(--grey-soft); color: var(--ink-soft); cursor: not-allowed; transform: none; }
.nothing { grid-column: 1 / -1; color: var(--ink-soft); text-align: center; padding-block: 30px; }

/* Delivery */
.delivery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.del { border-radius: var(--r); padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.del h3 { font-size: 24px; }
.del .label { font-size: 13px; font-weight: 700; }
.del-1 { background: var(--yellow); color: #121412; }
.del-1 p { color: #3d3a20; }
.del-2 { background: var(--panel); color: #fff; box-shadow: inset 0 0 0 1px var(--panel-line); }
.del-2 .label { color: var(--green); }
.del-2 p { color: #c9cec8; }
.del-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

/* FAQ */
.faq { display: grid; gap: 10px; max-width: 820px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
.faq summary { cursor: pointer; font-weight: 700; padding-block: 14px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--green); flex: none; }
.faq details[open] summary::after { content: "−"; }
.faq details p { color: var(--ink-soft); padding-bottom: 16px; max-width: 65ch; }

footer { background: var(--black); color: #8f948e; font-size: 14px; }
footer .wrap { padding-block: 26px calc(90px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
footer b { color: #fff; }

/* Floating WhatsApp */
.wa-float {
  position: fixed; z-index: 15; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center;
  box-shadow: 0 8px 24px rgba(18,20,18,.25); transition: transform .15s ease;
}
.wa-float:hover { transform: scale(1.06); }
.wa-float svg { width: 28px; height: 28px; }

/* Cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(18,20,18,.5); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 21; background: var(--bg);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) 20px;
  display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  transform: translateX(105%); transition: transform .3s ease;
  box-shadow: -10px 0 40px rgba(18,20,18,.15);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; }
.drawer-head h2 { font-size: 26px; }
.x { border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.item > div { min-width: 0; }
.item .thumb { width: 60px; height: 60px; border-radius: 10px; overflow: hidden; background: #fff; }
.item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .name { font-weight: 700; font-size: 15px; }
.item .sub { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--grey-soft); font-weight: 700; }
.qty span { min-width: 18px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--ink-soft); padding-block: 40px; display: grid; gap: 8px; justify-items: center; }
.totals { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.totals div { display: flex; justify-content: space-between; gap: 10px; }
.totals .sum { font-size: 22px; font-weight: 800; }
.free-note { font-size: 13px; color: var(--green); font-weight: 600; }
.progress { height: 6px; border-radius: 999px; background: var(--grey-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.checkout { display: grid; gap: 10px; }
.checkout label { font-size: 13px; font-weight: 600; color: var(--ink-soft); display: grid; gap: 4px; }
.checkout input { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.checkout input:focus { border-color: var(--green); outline: none; }
.checkout .btn { width: 100%; }
.send-note { font-size: 13px; color: var(--ink-soft); }
.err { font-size: 13px; color: var(--err); font-weight: 700; }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 300%);
  background: var(--black); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 30;
  box-shadow: inset 0 0 0 1px var(--header-line);
  transition: transform .25s ease; max-width: calc(100% - 32px); text-align: center;
}
.toast b { color: var(--yellow); }
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

/* Варианты покупки и наличие (в штуках) */
function variants(p) {
  if (p.pack && !p.setOnly) return [{ k: 'set', n: p.pack, price: p.price }, { k: 'pc', n: 1, price: p.pcPrice, min: p.minPc || 1 }];
  if (p.pack) return [{ k: 'set', n: p.pack, price: p.price }];
  return [{ k: 'one', n: 1, price: p.price }];
}
const stockOf = p => p.pack || 1;
const findVariant = (p, k) => variants(p).find(v => v.k === k);
const usedOf = p => Object.entries(cart).reduce((s, [key, q]) => {
  const [id, k] = key.split(':'); if (id !== p.id) return s;
  const v = findVariant(p, k); return s + (v ? v.n * q : 0);
}, 0);
const leftOf = p => stockOf(p) - usedOf(p);
/* Сколько штук добавится следующим нажатием: первый раз — минимум (например, от 3 шт), потом по одной */
const stepOf = (p, v) => (cart[p.id + ':' + v.k] || 0) ? 1 : (v.min || 1);
const canAdd = (p, v) => leftOf(p) >= v.n * stepOf(p, v);

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  age: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 12V4h8l10 10-7 7z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.4-.7-2-1.3-.5-.5-1-1.1-1.3-1.7-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.6.6-.9 1.4-.9 2.2 0 1 .4 1.9 1 2.7a11 11 0 0 0 4.2 3.7c1.6.7 2.2.7 3 .6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3Z"/></svg>',
};

const $ = id => document.getElementById(id);
const root = document.documentElement;
const azn = n => { const v = Math.round(n * 100) / 100; return v.toLocaleString('ru-RU', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }) + ' ₼'; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let lang = store.get('squishaz-lang') === 'az' ? 'az' : 'ru';
const t = (k, ...a) => { const v = T[lang][k] ?? T.ru[k]; return typeof v === 'function' ? v(...a) : v; };

let cart = {};
try { cart = JSON.parse(store.get('squishaz-toys-cart') || '{}') || {}; } catch (e) { cart = {}; }
const saveCart = () => store.set('squishaz-toys-cart', JSON.stringify(cart));
let form = { name: '', addr: '', comment: '' };
let filter = 'all', query = '', giftAge = 6, giftBudget = 10;

function waUrl(text) { return `https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`; }

/* Theme */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function paintThemeBtn() {
  const b = $('themeBtn');
  b.innerHTML = isDark() ? SUN : MOON;
  const label = isDark() ? t('theme.light') : t('theme.dark');
  b.setAttribute('aria-label', label); b.title = label;
}
{ const saved = store.get('squishaz-theme'); if (saved === 'dark' || saved === 'light') root.dataset.theme = saved; }
$('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  root.dataset.theme = next; store.set('squishaz-theme', next); paintThemeBtn();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

/* Static texts */
function applyTexts() {
  root.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('openCart').setAttribute('aria-label', t('cart.open'));
  $('closeCart').setAttribute('aria-label', t('cart.close'));
  $('drawer').setAttribute('aria-label', t('cart'));
  document.querySelectorAll('.wa-link').forEach(a => { a.href = waUrl(t('msg.hello')); });
  $('waFloat').innerHTML = ICONS.wa;
  document.querySelectorAll('.del-actions .wa-link').forEach(a => { a.innerHTML = ICONS.wa + t('wa.write'); });

  $('showcase').innerHTML = [['p10.jpg', 'squish'], ['p12.jpg', 'prank'], ['p03.jpg', 'active'], ['p06.jpg', 'fun']]
    .map(([src, cat]) => `<a class="tile" href="#catalog" data-tile="${cat}"><img src="${src}" alt="${t('tile.' + cat)}"><span>${t('tile.' + cat)}</span></a>`).join('');

  $('benefits').innerHTML = [['truck', 'b1'], ['check', 'b2'], ['age', 'b3'], ['chat', 'b4']]
    .map(([ic, k]) => `<div class="benefit"><span class="ic">${ICONS[ic]}</span><div><b>${t(k + '.t')}</b><p>${t(k + '.p')}</p></div></div>`).join('');

  $('faqList').innerHTML = t('faq').map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  paintThemeBtn();
}

/* Cards */
const vLabel = (p, v) => v.k === 'set' ? t('v.set', v.n) : v.k === 'pc' ? (v.min > 1 ? t('v.pcMin', v.min) : t('v.pc')) : '';
const vPrice = v => v.k === 'pc' ? `${azn(v.price)} ${t('perPc')}` : azn(v.price);
function stockText(p) {
  const left = leftOf(p);
  if (p.setOnly) return left >= p.pack ? t('stock.set') : t('soldout');
  return left > 0 ? t('stock', left) : t('soldout');
}
function card(p) {
  const vs = variants(p);
  const v = findVariant(p, picked[p.id]) || vs[0];
  const ok = canAdd(p, v);
  const out = !vs.some(x => canAdd(p, x));
  return `<article class="card">
    <div class="art">
      <img src="${p.img}" alt="${p.name[lang]}" loading="lazy">
      ${p.badge ? `<span class="badge">${t('badge.' + p.badge)}</span>` : ''}
    </div>
    <div class="body">
      <span class="cat-label">${t('c.' + p.cat)}</span>
      <h3>${p.name[lang]}</h3>
      <p class="note">${p.note[lang]}</p>
      ${vs.length > 1
        ? `<div class="variant" role="group">${vs.map(x => `<button class="vbtn" data-pick="${p.id}:${x.k}" aria-pressed="${x.k === v.k}">${vLabel(p, x)} · ${vPrice(x)}</button>`).join('')}</div>`
        : p.setOnly ? `<div class="variant"><span class="vtag">${t('v.set', p.pack)}</span></div>` : ''}
      <p class="stock${out ? ' out' : ''}">${stockText(p)}</p>
      <div class="buy">
        <span class="price">${vPrice(v)}</span>
        <button class="btn" data-add="${p.id}:${v.k}" ${ok ? '' : 'disabled'}>${ok ? t('add') : t('soldout.btn')}</button>
      </div>
    </div>
  </article>`;
}

function renderFilters() {
  $('filters').setAttribute('aria-label', t('cat.title'));
  $('filters').innerHTML = CATS.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === filter}">${t('c.' + c)}</button>`).join('');
}
function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = PRODUCTS.filter(p => (filter === 'all' || p.cat === filter) &&
    (!q || [p.name.ru, p.name.az, p.note.ru, p.note.az].some(s => s.toLowerCase().includes(q))));
  $('grid').innerHTML = list.length ? list.map(card).join('') : `<p class="nothing">${t('cat.nothing')}</p>`;
}

/* Cart: ключ = "id:вариант" */
function lineOf(key) {
  const [id, k] = key.split(':');
  const p = PRODUCTS.find(x => x.id === id);
  const v = p && findVariant(p, k);
  return v ? { p, v } : null;
}
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const subtotal = () => Math.round(Object.entries(cart).reduce((s, [key, q]) => { const l = lineOf(key); return s + (l ? l.v.price * q : 0); }, 0) * 100) / 100;
const lineName = ({ p, v }) => p.name[lang] + (v.k === 'set' ? ` (${vLabel(p, v)})` : v.k === 'pc' ? ` (${t('v.pc')})` : '');

function orderText() {
  const sub = subtotal(), ship = sub >= FREE_FROM ? 0 : SHIP;
  const lines = Object.entries(cart).map(([key, q]) => {
    const l = lineOf(key);
    return `• ${lineName(l)} × ${q} = ${azn(l.v.price * q)}`;
  });
  return [t('msg.hi'), ...lines, '',
    `${t('goods')}: ${azn(sub)}`,
    `${t('courier')}: ${ship ? azn(ship) : t('free')}`,
    `${t('total')}: ${azn(sub + ship)}`, '',
    `${t('msg.name')}: ${form.name.trim()}`,
    `${t('msg.addr')}: ${form.addr.trim()}`,
    form.comment.trim() ? `${t('msg.comment')}: ${form.comment.trim()}` : ''
  ].filter((l, i, arr) => !(l === '' && i === arr.length - 1)).join('\n');
}
function updateSendLink() {
  const a = $('sendWa'); if (a) a.href = waUrl(orderText());
}

function fixCart() {
  for (const key of Object.keys(cart)) {
    const l = lineOf(key);
    if (!l || !(cart[key] >= (l.v.min || 1))) delete cart[key];
  }
  for (const p of PRODUCTS) {
    while (leftOf(p) < 0) {
      const key = Object.keys(cart).find(k => k.startsWith(p.id + ':'));
      if (!key) break;
      const l = lineOf(key);
      if (--cart[key] < (l.v.min || 1)) delete cart[key];
    }
  }
}

function renderCart() {
  fixCart();
  $('cartCount').textContent = count();
  const entries = Object.entries(cart);
  if (!entries.length) {
    $('items').innerHTML = `<div class="empty"><b>${t('empty.t')}</b><span>${t('empty.p')}</span></div>`;
    $('checkoutBox').innerHTML = '';
    return;
  }
  $('items').innerHTML = entries.map(([key, q]) => {
    const l = lineOf(key);
    const more = canAdd(l.p, l.v);
    return `<div class="item">
      <div class="thumb"><img src="${l.p.img}" alt=""></div>
      <div><div class="name">${lineName(l)}</div><div class="sub">${azn(l.v.price)} × ${q} = ${azn(l.v.price * q)}</div></div>
      <div class="qty"><button data-dec="${key}" aria-label="${t('minus')}">−</button><span>${q}</span><button data-inc="${key}" aria-label="${t('plus')}" ${more ? '' : 'disabled'}>+</button></div>
    </div>`;
  }).join('');
  const sub = subtotal(), ship = sub >= FREE_FROM ? 0 : SHIP;
  const pct = Math.min(100, Math.round(sub / FREE_FROM * 100));
  $('checkoutBox').innerHTML = `
    <div class="totals">
      <div class="free-note">${ship ? t('left', azn(FREE_FROM - sub)) : t('gotFree')}</div>
      <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div><span>${t('goods')}</span><span>${azn(sub)}</span></div>
      <div><span>${t('courier')}</span><span>${ship ? azn(ship) : t('free')}</span></div>
      <div class="sum"><span>${t('total')}</span><span>${azn(sub + ship)}</span></div>
    </div>
    <div class="checkout">
      <label for="cName">${t('f.name')}<input id="cName" autocomplete="name" value=""></label>
      <label for="cAddr">${t('f.addr')}<input id="cAddr" autocomplete="street-address" placeholder="${t('f.addr.ph')}"></label>
      <label for="cComment">${t('f.comment')}<input id="cComment" placeholder="${t('f.comment.ph')}"></label>
      <div class="err" id="sendErr" hidden>${t('send.err')}</div>
      <a class="btn green" id="sendWa" target="_blank" rel="noopener">${ICONS.wa}${t('send')}</a>
      <p class="send-note">${t('send.note')}</p>
    </div>`;
  $('cName').value = form.name; $('cAddr').value = form.addr; $('cComment').value = form.comment;
  updateSendLink();
}

let tt;
function toast(html) { const el = $('toast'); el.innerHTML = html; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1800); }
function changed() { saveCart(); renderCart(); renderGrid(); }
function add(key) {
  const l = lineOf(key); if (!l) return;
  if (!canAdd(l.p, l.v)) { toast(t('noMore')); return; }
  cart[key] = (cart[key] || 0) + stepOf(l.p, l.v); changed();
  toast(`<b>${lineName(l)}</b> ${t('inCart')}`);
}
function openCart() { $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').hidden = false; }
function closeCart() { $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').hidden = true; }

function renderAll() { applyTexts(); renderFilters(); renderGrid(); renderCart(); }

document.addEventListener('click', e => {
  const tile = e.target.closest('[data-tile]');
  if (tile) { filter = tile.dataset.tile; renderFilters(); renderGrid(); return; }
  if (e.target.closest('#sendWa') && (!form.name.trim() || !form.addr.trim())) {
    e.preventDefault(); $('sendErr').hidden = false; (form.name.trim() ? $('cAddr') : $('cName')).focus(); return;
  }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; store.set('squishaz-lang', lang); renderAll(); }
  if (b.dataset.cat) { filter = b.dataset.cat; renderFilters(); renderGrid(); }
  if (b.dataset.pick) { const [id, k] = b.dataset.pick.split(':'); picked[id] = k; renderGrid(); }
  if (b.dataset.add) add(b.dataset.add);
  if (b.dataset.inc) add(b.dataset.inc);
  if (b.dataset.dec) {
    const l = lineOf(b.dataset.dec);
    if (--cart[b.dataset.dec] < ((l && l.v.min) || 1)) delete cart[b.dataset.dec];
    changed();
  }
  if (b.dataset.copy) {
    try { navigator.clipboard.writeText(b.dataset.copy).then(() => toast(t('copied')), () => toast(t('copyFail'))); }
    catch (err) { toast(t('copyFail')); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { query = e.target.value; renderGrid(); }
  if (e.target.id === 'cName') form.name = e.target.value;
  if (e.target.id === 'cAddr') form.addr = e.target.value;
  if (e.target.id === 'cComment') form.comment = e.target.value;
  if (['cName', 'cAddr', 'cComment'].includes(e.target.id)) {
    updateSendLink();
    if (form.name.trim() && form.addr.trim()) $('sendErr').hidden = true;
  }
});
$('openCart').onclick = openCart; $('closeCart').onclick = closeCart; $('scrim').onclick = closeCart;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCart(); });

renderAll();
</script>

</html>
